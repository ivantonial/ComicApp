			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Type a script or drag a script file from your workspace to insert its path.\n#!/bin/bash\n\necho \"🧪 Executando testes dos módulos...\"\n\nMODULES_PATH=\"${SRCROOT}/Modules\"\nDESTINATION=\"platform=iOS Simulator,name=iPhone 17 Pro Max\"\nLOG_DIR=\"/tmp/comicapp_tests\"\n\n# Criar diretório de logs\nmkdir -p \"$LOG_DIR\"\n\nMODULES=(\n    \"AppCoordinator\"\n    \"Cache\"\n    \"Core\"\n    \"ComicVineAPI\"\n    \"DesignSystem\"\n    \"Networking\"\n    \"Features/CharacterList\"\n    \"Features/CharacterDetail\"\n    \"Features/ComicsList\"\n    \"Features/Favorites\"\n    \"Features/Search\"\n    \"Features/Settings\"\n)\n\nPASSED=()\nFAILED=()\n\nfor module in \"${MODULES[@]}\"; do\n    MODULE_NAME=$(basename \"$module\")\n    LOG_FILE=\"$LOG_DIR/${MODULE_NAME}.log\"\n    \n    echo \"\"\n    echo \"========================================\"\n    echo \"📦 Testando: $MODULE_NAME\"\n    echo \"========================================\"\n    \n    cd \"$MODULES_PATH/$module\"\n    \n    # Executa sem -quiet e salva log\n    if xcodebuild test \\\n        -scheme \"$MODULE_NAME\" \\\n        -destination \"$DESTINATION\" \\\n        2>&1 | tee \"$LOG_FILE\" | grep -E \"Test Case|error:|failed|passed|BUILD FAILED\"; then\n        \n        # Verifica se realmente passou (grep no log)\n        if grep -q \"TEST FAILED\\|BUILD FAILED\" \"$LOG_FILE\"; then\n            echo \"❌ $MODULE_NAME: FALHOU\"\n            echo \"   📄 Log: $LOG_FILE\"\n            # Mostra os erros específicos\n            echo \"   📋 Erros encontrados:\"\n            grep -E \"error:|failed|✘\" \"$LOG_FILE\" | head -20\n            FAILED+=(\"$MODULE_NAME\")\n        else\n            echo \"✅ $MODULE_NAME: OK\"\n            PASSED+=(\"$MODULE_NAME\")\n        fi\n    else\n        # xcodebuild retornou erro\n        if grep -q \"TEST FAILED\\|BUILD FAILED\" \"$LOG_FILE\"; then\n            echo \"❌ $MODULE_NAME: FALHOU\"\n            echo \"   📄 Log: $LOG_FILE\"\n            echo \"   📋 Erros encontrados:\"\n            grep -E \"error:|failed|✘\" \"$LOG_FILE\" | head -20\n            FAILED+=(\"$MODULE_NAME\")\n        else\n            echo \"✅ $MODULE_NAME: OK\"\n            PASSED+=(\"$MODULE_NAME\")\n        fi\n    fi\ndone\n\necho \"\"\necho \"========================================\"\necho \"📊 RESUMO DOS TESTES\"\necho \"========================================\"\necho \"\"\necho \"✅ Passaram (${#PASSED[@]}):\"\nfor m in \"${PASSED[@]}\"; do\n    echo \"   - $m\"\ndone\necho \"\"\necho \"❌ Falharam (${#FAILED[@]}):\"\nfor m in \"${FAILED[@]}\"; do\n    echo \"   - $m\"\n    echo \"     Log: $LOG_DIR/${m}.log\"\ndone\necho \"\"\necho \"📁 Logs salvos em: $LOG_DIR\"\necho \"\"\n\nif [ ${#FAILED[@]} -eq 0 ]; then\n    echo \"🎉 Todos os testes passaram!\"\n    exit 0\nelse\n    echo \"⚠️ Alguns testes falharam.\"\n    echo \"\"\n    echo \"Para ver detalhes de um módulo que falhou:\"\n    echo \"  cat $LOG_DIR/<MODULE_NAME>.log | grep -E 'error:|failed|✘'\"\n    exit 1\nfi\n";
